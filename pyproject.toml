[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replacement"
version = "0.1.0"
description = "Base remota autenticada del reemplazo con mensajes provisionales"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.0,<4.0",
    "gunicorn>=21.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools]
packages = ["replacement", "probe_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
